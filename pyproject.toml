[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "papertrans"
version = "0.1.0"
description = "Layout-aware academic PDF translation toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "papertrans contributors" }]
dependencies = [
  "httpx>=0.28,<1",
  "PyMuPDF>=1.24,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]
ocr = [
  "paddleocr==3.7.0",
  "paddlepaddle==3.3.1",
]

[project.scripts]
papertrans = "papertrans.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

